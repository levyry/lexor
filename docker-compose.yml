services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lexor:latest
    container_name: combinator-explorer
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
